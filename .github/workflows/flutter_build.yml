name: Flutter Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Find and Build
        run: |
          # Sabse pehle pubspec.yaml file dhoondo
          PROJECT_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter create . --platforms android
          flutter pub get
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=./build_info --tree-shake-icons
          
      - name: Locate APKs
        run: |
          # Sabhi split APKs ko root mein copy karo
          find . -name "app-*-release.apk" -exec cp {} ./ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: ./*-release.apk